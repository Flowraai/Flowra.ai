# Ambiente de PRODUÇÃO com HTTPS (Caddy). As variáveis vêm de um .env NÃO
# versionado (ver .env.example). Em produção real, use um cofre de segredos.
#
#   cp .env.example .env    # preencha DOMAIN, ACME_EMAIL e os segredos
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Fluxo: Caddy (443, TLS automático) -> web (nginx: SPA + proxy /api) -> api -> db.
# Só o Caddy publica portas; api e db ficam na rede interna do compose.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-flowra_care}
    volumes:
      - flowra_prod_pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowra} -d ${POSTGRES_DB:-flowra_care}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Rate limit compartilhado (SEC-2). Estado efêmero — sem volume.
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-flowra}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flowra_care}
      STORAGE_DIR: /data/uploads
      # SEC-2 — rate limit compartilhado entre workers; permite WEB_CONCURRENCY>1.
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: "2"
      EVOLUTION_API_URL: http://evolution:8080
      # Aplica migrações e popula o protocolo psiquiátrico no boot (idempotente).
      RUN_MIGRATIONS: "true"
      SEED_PROTOCOL: "true"
    volumes:
      - flowra_prod_uploads:/data/uploads
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Agendador: lembretes de medicação/consulta e alertas de inatividade rodando
  # sozinhos. Reaproveita a imagem da API; não aplica migrações (a api já aplica).
  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-flowra}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flowra_care}
      EVOLUTION_API_URL: http://evolution:8080
      RUN_MIGRATIONS: "false"
      SEED_PROTOCOL: "false"
    command: ["python", "-m", "app.scripts.scheduler"]
    # O worker não sobe servidor HTTP; desliga o healthcheck herdado da imagem da API.
    healthcheck:
      disable: true
    restart: always

  web:
    build: ./web
    depends_on:
      - api
    environment:
      API_UPSTREAM: api:8000
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 5s

  # WhatsApp por médico (Evolution API dedicada, só na rede interna — sem porta
  # pública). Cada médico pareia o próprio número pelo painel (QR). Banco próprio.
  evolution-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?defina EVOLUTION_DB_PASSWORD no .env}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    depends_on:
      evolution-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      # LGPD/minimização: guarda só o necessário à sessão; não persiste mensagens/contatos.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      SERVER_URL: http://evolution:8080
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances
    restart: always

  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?defina DOMAIN no .env, ex. app.flowraai.com.br}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - flowra_caddy_data:/data
      - flowra_caddy_config:/config
    restart: always

volumes:
  flowra_prod_pgdata:
  flowra_prod_uploads:
  flowra_caddy_data:
  flowra_caddy_config:
  evolution_pgdata:
  evolution_instances:
