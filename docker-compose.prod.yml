# Ambiente de PRODUÇÃO com HTTPS (Caddy). As variáveis vêm de um .env NÃO
# versionado (ver .env.example). Em produção real, use um cofre de segredos.
#
#   cp .env.example .env    # preencha DOMAIN, ACME_EMAIL e os segredos
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Fluxo: Caddy (443, TLS automático) -> web (nginx: SPA + proxy /api) -> api -> db.
# Só o Caddy publica portas; api e db ficam na rede interna do compose.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-flowra_care}
    volumes:
      - flowra_prod_pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowra} -d ${POSTGRES_DB:-flowra_care}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-flowra}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flowra_care}
      STORAGE_DIR: /data/uploads
      # Aplica migrações e popula o protocolo psiquiátrico no boot (idempotente).
      RUN_MIGRATIONS: "true"
      SEED_PROTOCOL: "true"
    volumes:
      - flowra_prod_uploads:/data/uploads
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build: ./web
    depends_on:
      - api
    environment:
      API_UPSTREAM: api:8000
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?defina DOMAIN no .env, ex. app.flowraai.com.br}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - flowra_caddy_data:/data
      - flowra_caddy_config:/config
    restart: always

volumes:
  flowra_prod_pgdata:
  flowra_prod_uploads:
  flowra_caddy_data:
  flowra_caddy_config:
