# Produção ATRÁS DE UM PROXY JÁ EXISTENTE (ex.: nginx nativo da VPS Hostinger).
# NÃO sobe Caddy nem ocupa 80/443. O painel (web) publica só em 127.0.0.1:CARE_WEB_PORT;
# o seu nginx faz o proxy de care.SEUDOMINIO -> essa porta (TLS via certbot).
#
#   cp .env.example .env    # preencha os segredos (DOMAIN não é usado aqui)
#   docker compose -f docker-compose.behind-proxy.yml up -d --build
#
# Fluxo: nginx do host (443/TLS) -> web (nginx interno: SPA + proxy /api) -> api -> db.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-flowra_care}
    volumes:
      - flowra_prod_pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowra} -d ${POSTGRES_DB:-flowra_care}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-flowra}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-flowra_care}
      STORAGE_DIR: /data/uploads
      RUN_MIGRATIONS: "true"
      SEED_PROTOCOL: "true"
    volumes:
      - flowra_prod_uploads:/data/uploads
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build: ./web
    depends_on:
      - api
    environment:
      API_UPSTREAM: api:8000
    # Publica SÓ no localhost do host; o nginx nativo faz o proxy público.
    ports:
      - "127.0.0.1:${CARE_WEB_PORT:-8090}:80"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 5s

volumes:
  flowra_prod_pgdata:
  flowra_prod_uploads:
