name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowra
          POSTGRES_PASSWORD: flowra
          POSTGRES_DB: flowra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowra -d flowra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://flowra:flowra@localhost:5432/flowra_test
      JWT_SECRET_KEY: ci-secret-nao-usar-em-producao
      DEBUG: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Validate Alembic migration applies cleanly
        run: alembic upgrade head

      - name: Run test suite
        run: pytest -q
