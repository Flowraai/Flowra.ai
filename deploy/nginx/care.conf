# Painel Flowra Care atrás do nginx nativo da VPS.
# 1) Troque care.SEUDOMINIO pelo seu subdomínio (ex.: care.flowraai.com.br).
# 2) Copie para /etc/nginx/sites-available/care.conf e habilite:
#      ln -s /etc/nginx/sites-available/care.conf /etc/nginx/sites-enabled/
#    (ou coloque em /etc/nginx/conf.d/care.conf, conforme a sua instalação)
# 3) nginx -t && systemctl reload nginx
# 4) certbot --nginx -d care.SEUDOMINIO   # adiciona o HTTPS neste bloco
#
# Este arquivo NÃO altera os outros sites do nginx — é um server_name novo.
server {
    listen 80;
    listen [::]:80;
    server_name care.SEUDOMINIO;

    # Anexos (fotos/áudio) vão até ~10 MB; folga de 15m.
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:8090;   # web do Care (docker-compose.behind-proxy.yml)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
