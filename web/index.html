<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowra Care — Painel</title>
    <meta name="description" content="Painel do médico do Flowra Care: acompanhamento psiquiátrico entre consultas." />
    <script>
      // Aplica o tema antes de renderizar para evitar "flash" do tema errado.
      (function () {
        try {
          var t = localStorage.getItem("flowra-theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
