# Ambiente de DESENVOLVIMENTO. Para produção, use docker-compose.prod.yml.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowra
      POSTGRES_PASSWORD: flowra
      POSTGRES_DB: flowra_care
    ports:
      - "5432:5432"
    volumes:
      - flowra_care_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowra -d flowra_care"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_FORMAT: text
      DATABASE_URL: postgresql+asyncpg://flowra:flowra@db:5432/flowra_care
      JWT_SECRET_KEY: dev-secret-nao-use-em-producao
      # O entrypoint aplica as migrações; populamos o protocolo no dev.
      SEED_PROTOCOL: "true"
    ports:
      - "8000:8000"

volumes:
  flowra_care_pgdata:
